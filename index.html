<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Emploi du temps</title>
<meta name="theme-color" content="#f4f6fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6fa;
  --panel:#ffffff;
  --panel-2:#eef1f7;
  --line:#e2e6ee;
  --text:#1a1d27;
  --sub:#8891a5;
  --accent:#5e7dff;
  --accent-2:#1fae8e;
  --radius:18px;
  --radius-sm:10px;
  --gap:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"SF Pro Text",-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%, #e8edfb 0%, var(--bg) 55%);
  color:var(--text);
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
}
/* TOPBAR */
#topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
#topbar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px;color:var(--text);}
#topbar .spacer{flex:1;}
.btn{
  border:none;cursor:pointer;
  background:var(--panel-2);
  color:var(--text);
  padding:10px 16px;
  border-radius:999px;
  font-size:14px;
  font-weight:500;
  display:flex;align-items:center;gap:6px;
  transition:transform .15s ease, background .15s ease;
  border:1px solid var(--line);
}
.btn:active{transform:scale(.94);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#7c9eff);color:#fff;border:none;}
.btn.ghost{background:transparent;}
.btn svg{width:16px;height:16px;}

/* MAIN LAYOUT */
#main{flex:1;display:flex;overflow:hidden;}
#palette{
  width:190px;flex:0 0 auto;
  border-right:1px solid var(--line);
  background:rgba(19,23,32,.6);
  padding:14px 10px;
  overflow-y:auto;
}
#palette h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);margin:6px 6px 10px;font-weight:600;}
.palette-item{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-bottom:8px;
  cursor:grab;
  font-size:13px;
  font-weight:600;
  display:flex;align-items:center;gap:8px;
  touch-action:none;
}
.palette-item .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.palette-add{
  width:100%;padding:10px;margin-top:4px;
  border-radius:var(--radius-sm);
  border:1px dashed var(--line);
  background:transparent;color:var(--sub);
  font-size:13px;cursor:pointer;
}

#gridwrap{flex:1;overflow:auto;padding:16px;position:relative;}
#grid{
  position:relative;
  display:grid;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--panel);
  min-width:760px;
}
.hcell{
  background:var(--panel-2);
  color:var(--sub);
  font-size:11.5px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  position:sticky;top:0;z-index:5;
  padding:10px 4px;
}
.corner{position:sticky;left:0;top:0;z-index:6;background:var(--panel-2);}
.timecell{
  background:var(--panel);
  color:var(--sub);
  font-size:11px;
  text-align:right;
  padding:2px 10px 0 0;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  position:sticky;left:0;z-index:4;
}
.daycol{
  border-right:1px solid var(--line);
  position:relative;
  background:
    repeating-linear-gradient(to bottom, transparent, transparent calc(var(--slotpx) - 1px), var(--line) calc(var(--slotpx) - 1px), var(--line) var(--slotpx));
}
.block{
  position:absolute;
  left:3px;right:3px;
  border-radius:var(--radius-sm);
  padding:6px 8px;
  color:#1a1d27;
  font-size:11.5px;
  line-height:1.25;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 4px 14px rgba(20,30,60,.12);
  border:1px solid rgba(0,0,0,.08);
  touch-action:none;
  user-select:none;
}
.block b{display:block;font-size:12.5px;font-weight:700;margin-bottom:1px;}
.block .room{opacity:.75;font-weight:600;}
.block .wtag{
  position:absolute;top:4px;right:6px;
  font-size:9px;font-weight:800;
  background:rgba(0,0,0,.12);
  border-radius:5px;padding:1px 4px;
}
.block .resize{
  position:absolute;left:0;right:0;bottom:0;height:10px;
  cursor:ns-resize;
}
.block.dragging{opacity:.75;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.5);}
.ghost{
  position:absolute;left:3px;right:3px;
  border:2px dashed var(--accent-2);
  border-radius:var(--radius-sm);
  background:rgba(94,230,196,.08);
  pointer-events:none;
  z-index:2;
}

/* MODALS */
.overlay{
  position:fixed;inset:0;background:rgba(30,35,50,.3);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  width:min(420px,92vw);
  max-height:86vh;
  overflow-y:auto;
  padding:22px;
  transform:translateY(14px) scale(.98);
  transition:transform .18s ease;
}
.overlay.show .sheet{transform:translateY(0) scale(1);}
.sheet h3{margin:0 0 16px;font-size:17px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600;}
.field input[type=text],.field input[type=number],.field select{
  width:100%;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:14px;
}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:#fff;}
.seg{display:flex;background:var(--panel-2);border-radius:12px;padding:3px;border:1px solid var(--line);}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--accent);color:#fff;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-actions .btn{flex:1;justify-content:center;}
.danger{color:#ff8a8a;}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0;}
.settings-list{display:flex;flex-direction:column;gap:10px;}
.mini{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
</head>
<body>

<div id="topbar">
  <h1>Emploi du temps</h1>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnWeek">Semaine A</button>
  <button class="btn" id="btnSettings">⚙ Réglages</button>
</div>

<div id="main">
  <div id="palette">
    <h2>Cours à placer</h2>
    <div id="paletteList"></div>
    <button class="palette-add" id="btnNewCourse">+ Nouveau cours</button>
  </div>
  <div id="gridwrap">
    <div id="grid"></div>
  </div>
</div>

<!-- Edit block sheet -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h3 id="editTitle">Modifier le cours</h3>
    <div class="field">
      <label>Matière</label>
      <input type="text" id="fSubject" placeholder="ex: MATHS SPE">
    </div>
    <div class="row2">
      <div class="field">
        <label>Professeur</label>
        <input type="text" id="fTeacher" placeholder="ex: Grimonprez M.">
      </div>
      <div class="field">
        <label>Salle</label>
        <input type="text" id="fRoom" placeholder="ex: Salle 208">
      </div>
    </div>
    <div class="field">
      <label>Couleur</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <label>Semaine</label>
      <div class="seg" id="weekSeg">
        <button data-v="all" class="active">Toutes</button>
        <button data-v="A">A</button>
        <button data-v="B">B</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost danger" id="btnDelete">Supprimer</button>
      <button class="btn primary" id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>Réglages</h3>
    <div class="settings-list">
      <div class="row2">
        <div class="field">
          <label>Heure de début</label>
          <input type="number" id="sStart" min="0" max="23" value="8">
        </div>
        <div class="field">
          <label>Heure de fin</label>
          <input type="number" id="sEnd" min="1" max="24" value="18">
        </div>
      </div>
      <div class="field">
        <label>Pas de la grille (minutes)</label>
        <select id="sStep">
          <option value="15">15 min</option>
          <option value="30" selected>30 min</option>
          <option value="60">60 min</option>
        </select>
      </div>
      <div class="field">
        <label>Jours affichés</label>
        <div class="swatches" id="dayToggles"></div>
      </div>
    </div>
    <hr class="sep">
    <div class="field">
      <button class="btn primary" style="width:100%;justify-content:center" id="btnApplySettings">Appliquer la grille</button>
    </div>
    <hr class="sep">
    <div class="settings-list">
      <button class="btn" style="width:100%;justify-content:center" id="btnSaveDefault">💾 Définir comme emploi du temps de base</button>
      <button class="btn" style="width:100%;justify-content:center" id="btnLoadDefault">↺ Recharger l'emploi du temps de base</button>
      <button class="btn ghost danger" style="width:100%;justify-content:center" id="btnClear">Effacer la grille actuelle</button>
    </div>
    <p class="mini">L'emploi du temps actif est sauvegardé automatiquement sur cette tablette. « Emploi du temps de base » sert de sauvegarde de référence, rechargeable à tout moment.</p>
    <div class="sheet-actions">
      <button class="btn primary" style="width:100%;justify-content:center" id="btnCloseSettings">Fermer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
