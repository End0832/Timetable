<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Emploi du temps</title>
<meta name="theme-color" content="#f4f6fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6fa;
  --panel:#ffffff;
  --panel-2:#eef1f7;
  --line:#e2e6ee;
  --text:#1a1d27;
  --sub:#8891a5;
  --accent:#5e7dff;
  --radius:16px;
  --radius-sm:10px;
  --rowh:58px;
  --timecolw:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"SF Pro Text",-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
}
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
#topbar h1{font-size:15px;font-weight:700;margin:0;}
#topbar .spacer{flex:1;}
.iconbtn{
  border:none;cursor:pointer;background:var(--panel-2);color:var(--text);
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--line);
}
.iconbtn:active{transform:scale(.92);}

#scheduleWrap{flex:1;display:flex;overflow:hidden;position:relative;}
#timeCol{
  width:var(--timecolw);flex:0 0 auto;
  background:var(--bg);
  padding-top:34px;
  border-right:1px solid var(--line);
  overflow:hidden;
}
.timeRow{
  height:var(--rowh);
  font-size:10.5px;color:var(--sub);font-weight:700;
  text-align:right;padding-right:6px;padding-top:2px;
}
#board{flex:1;overflow:hidden;position:relative;}
#boardHeader{
  display:flex;position:sticky;top:0;z-index:6;
  background:rgba(244,246,250,.95);
  border-bottom:1px solid var(--line);
  height:34px;
}
.dayhead{
  flex:1;min-width:130px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--text);
  border-right:1px solid var(--line);
}
#boardBody{position:relative;min-width:100%;}
.rowline{
  position:absolute;left:0;right:0;
  border-top:1px solid var(--line);
}
.collabel{
  position:absolute;top:0;bottom:0;
  border-right:1px solid var(--line);
}
.block{
  position:absolute;
  border-radius:var(--radius-sm);
  padding:5px 7px;
  color:#1a1d27;
  font-size:11.5px;
  line-height:1.25;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 2px 8px rgba(20,30,60,.10);
  border:1px solid rgba(0,0,0,.08);
  touch-action:none;
  user-select:none;
  z-index:2;
}
.block b{display:block;font-size:12px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.block .room{opacity:.7;font-weight:600;font-size:10.5px;}
.block .wtag{
  position:absolute;top:3px;right:5px;
  font-size:8.5px;font-weight:800;
  background:rgba(0,0,0,.12);
  border-radius:5px;padding:0px 4px;
}
.handle{
  position:absolute;left:0;right:0;height:10px;
  cursor:ns-resize;z-index:3;
}
.handle.top{top:-2px;}
.handle.bottom{bottom:-2px;}
.block.dragging{opacity:.8;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.2);}

#fabAdd{
  position:absolute;right:18px;bottom:18px;z-index:20;
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;
  font-size:26px;box-shadow:0 6px 18px rgba(94,125,255,.4);cursor:pointer;
}
#fabAdd:active{transform:scale(.94);}
#drawer{
  position:absolute;right:0;bottom:0;top:0;
  width:min(260px,80vw);
  background:var(--panel);
  border-left:1px solid var(--line);
  box-shadow:-8px 0 24px rgba(0,0,0,.08);
  transform:translateX(100%);
  transition:transform .2s ease;
  z-index:19;
  padding:16px 12px;
  overflow-y:auto;
}
#drawer.open{transform:translateX(0);}
#drawer h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin:4px 4px 10px;}
.chip{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;margin-bottom:7px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;
}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.addchip{width:100%;padding:9px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:12.5px;cursor:pointer;}
.drawer-hint{font-size:11px;color:var(--sub);margin:10px 4px 0;line-height:1.4;}

.overlay{
  position:fixed;inset:0;background:rgba(30,35,50,.32);
  display:flex;align-items:center;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .16s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  width:min(400px,92vw);max-height:86vh;overflow-y:auto;padding:20px;
  transform:translateY(10px) scale(.98);transition:transform .16s ease;
}
.overlay.show .sheet{transform:translateY(0) scale(1);}
.sheet h3{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
.field input[type=text],.field input[type=time],.field select{
  width:100%;padding:10px 11px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:14px;
}
.row2{display:flex;gap:8px;}
.row2>.field{flex:1;}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:var(--text);}
.seg{display:flex;background:var(--panel-2);border-radius:11px;padding:3px;border:1px solid var(--line);}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);padding:8px 0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--accent);color:#fff;}
.sheet-actions{display:flex;gap:8px;margin-top:16px;}
.sheet-actions .btn{flex:1;justify-content:center;}
.btn{border:none;cursor:pointer;background:var(--panel-2);color:var(--text);padding:10px 14px;border-radius:999px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);color:#fff;border:none;}
.danger{color:#d9534f;}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0;}
.mini{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.4;}
.rowedit{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.rowedit input[type=time]{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;}
.rowedit button{border:none;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--sub);font-size:13px;flex:0 0 auto;}
.daytoggle{display:inline-flex;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);margin:2px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
</head>
<body>

<div id="topbar">
  <h1>Emploi du temps</h1>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnSettings" title="Réglages">⚙</button>
</div>

<div id="scheduleWrap">
  <div id="timeCol"></div>
  <div id="board">
    <div id="boardHeader"></div>
    <div id="boardBody"></div>
  </div>
  <button id="fabAdd" title="Ajouter un cours">+</button>
  <div id="drawer">
    <h2>Cours</h2>
    <div id="paletteList"></div>
    <button class="addchip" id="btnNewCourse">+ Nouveau cours</button>
    <p class="drawer-hint">Glisse un cours sur la grille pour le placer. Tape dessus pour le modifier.</p>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h3 id="editTitle">Modifier le cours</h3>
    <div class="field">
      <label>Matière</label>
      <input type="text" id="fSubject" placeholder="ex: MATHS SPE">
    </div>
    <div class="row2">
      <div class="field">
        <label>Professeur</label>
        <input type="text" id="fTeacher" placeholder="ex: Grimonprez M.">
      </div>
      <div class="field">
        <label>Salle</label>
        <input type="text" id="fRoom" placeholder="ex: Salle 208">
      </div>
    </div>
    <div class="field">
      <label>Couleur</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field" id="weekField">
      <label>Semaine</label>
      <div class="seg" id="weekSeg">
        <button data-v="all" class="active">Toutes</button>
        <button data-v="A">A</button>
        <button data-v="B">B</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn danger" id="btnDelete">Supprimer</button>
      <button class="btn primary" id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>Réglages</h3>
    <label style="font-size:11.5px;color:var(--sub);font-weight:600;">Jours affichés</label>
    <div id="dayToggles" style="margin:8px 0 16px;"></div>
    <label style="font-size:11.5px;color:var(--sub);font-weight:600;">Créneaux horaires (définis à la main)</label>
    <div id="rowsEditor" style="margin-top:8px;"></div>
    <button class="addchip" id="btnAddRow" style="margin-top:4px;">+ Ajouter un créneau</button>
    <hr class="sep">
    <button class="btn primary" style="width:100%;" id="btnApplySettings">Appliquer</button>
    <hr class="sep">
    <button class="btn" style="width:100%;margin-bottom:8px;" id="btnSaveDefault">💾 Définir comme emploi du temps de base</button>
    <button class="btn" style="width:100%;margin-bottom:8px;" id="btnLoadDefault">↺ Recharger l'emploi du temps de base</button>
    <button class="btn danger" style="width:100%;" id="btnClear">Effacer la grille actuelle</button>
    <p class="mini">Sauvegarde automatique sur cette tablette.</p>
    <div class="sheet-actions">
      <button class="btn primary" style="width:100%;" id="btnCloseSettings">Fermer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
